services:
  postgres:
    image: postgres:16-alpine
    container_name: fusionlabs-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: template1
    ports:
      - "51214:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - fusionlabs_pg:/var/lib/postgresql/data

  postgres_shadow:
    image: postgres:16-alpine
    container_name: fusionlabs-pg-shadow
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: template1
    ports:
      - "51215:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  fusionlabs_pg:
